<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circuit lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#2a2a4a" stroke-width="1"/>
  <line x1="0" y1="430" x2="1200" y2="430" stroke="#2a2a4a" stroke-width="1"/>
  <circle cx="300" cy="200" r="12" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="600" cy="200" r="12" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <circle cx="900" cy="430" r="12" fill="none" stroke="#ff006e" stroke-width="1.5" opacity="0.4"/>
  <!-- Title -->
  <text x="600" y="290" font-family="system-ui, sans-serif" font-weight="700" font-size="64" fill="url(#grad)" text-anchor="middle">Qiskit Fall Fest 2026</text>
  <text x="600" y="350" font-family="system-ui, sans-serif" font-weight="400" font-size="24" fill="#8888aa" text-anchor="middle">VIT Chennai × QuantumPlators</text>
  <text x="600" y="400" font-family="system-ui, sans-serif" font-weight="400" font-size="18" fill="#8888aa" text-anchor="middle">Explore Quantum. Build with Qiskit. Connect with the Future.</text>
</svg>
